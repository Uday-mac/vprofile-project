services:
  db01:
    image: udaydevmac/vprofile-db
    container_name: db01
    build:
      context: .
      dockerfile: Dockerfiles/db/Dockerfile
    ports:
      - 3306:3306
    volumes:
      - db-vol:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=accounts
      - MYSQL_ROOT_PASSWORD=admin123
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - vprofile-network
  mc01:
    container_name: mc01
    image: memcached
    ports:
      - 11211:11211
    networks:
      - vprofile-network

  rmq01:
    container_name: rmq01
    image: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=test
      - RABBITMQ_DEFAULT_PASS=test
    ports:
      - 5672:5672
    networks:
      - vprofile-network
  vproapp:
    container_name: vproapp
    image: udaydevmac/vprofile-app
    build:
      context: .
      dockerfile: Dockerfiles/app/Dockerfile
    ports:
      - 8080:8080
    # volumes:
    #   - app-vol:/usr/local/tomcat/webapps
    depends_on:
      db01:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - vprofile-network

  vproweb:
    image: udaydevmac/vprofile-web
    container_name: vproweb
    build:
      context: .
      dockerfile: Dockerfiles/web/Dockerfile
    ports:
      - 80:80
    depends_on:
      vproapp:
        condition: service_healthy
    networks:
      - vprofile-network

volumes:
  db-vol: {}
  # app-vol: {}

networks:
  vprofile-network:
    driver: bridge